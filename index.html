<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000" id="nav-theme">
    <title>DOCTOR'S HUNT</title>
    <style>
        :root { --screen-height: 100dvh; }

        body { 
            background: linear-gradient(to bottom, #000000 60%, #443311 90%, #997722 100%);
            background-color: #000000;
            display: flex; 
            flex-direction: column;
            min-height: var(--screen-height); 
            width: 100vw;
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            font-family: 'Garamond', serif;
            color: #d4af37;
        }

        #white-out {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #efece3;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
            z-index: 999;
        }

        .container { width: 90%; max-width: 450px; text-align: center; z-index: 10; }

        input { 
            width: 100%; 
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #d4af37; 
            border-radius: 12px;
            color: #f1e5ac; 
            font-size: 1.8rem; 
            padding: 22px;
            text-align: center; 
            outline: none; 
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 0 15px #997722;
        }

        /* Final Page Layout Fix */
        #final-page {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 60px 0; /* Extra space for scrolling */
            overflow-y: auto;
            position: relative;
            z-index: 20;
        }

        #final-page h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            margin: 0 0 30px 0;
            letter-spacing: 8px;
            text-align: center;
        }

        .video-wrapper {
            width: 90%;
            max-width: 800px; /* Larger video on desktop */
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 40px rgba(153, 119, 34, 0.4);
            border: 3px solid #d4af37;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 50px;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* Leaderboard Styling */
        .leaderboard-container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            margin-bottom: 100px;
        }

        .leaderboard-container h3 {
            letter-spacing: 4px;
            border-bottom: 1px solid #d4af37;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .leader-row {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            font-size: 1.4rem;
        }

        .my-score {
            background: rgba(212, 175, 55, 0.2);
            font-weight: bold;
            color: #fff;
            border-radius: 8px;
        }

        #nameInput {
            margin-top: 30px;
            font-size: 1.2rem;
            padding: 15px;
            box-shadow: 0 0 10px #997722;
        }

        input::placeholder { color: #d4af37; animation: stableBlink 2.5s infinite both; }
        @keyframes stableBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    </style>
</head>
<body>

    <div id="white-out"></div>

    <div class="container" id="input-container">
        <input type="text" id="codeField" placeholder="ENTER CODE" autofocus autocomplete="off">
    </div>

    <div id="final-page">
        <h1>WELL DONE</h1>
        
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/KmVngyE8flc?rel=0" allowfullscreen></iframe>
        </div>

        <div class="leaderboard-container">
            <h3>LEADERBOARD</h3>
            <div id="leaderboard-list">Loading placements...</div>
            <input type="text" id="nameInput" placeholder="ENTER YOUR NAME" autocomplete="off">
        </div>
    </div>

    <script>
        let currentStep = 1;
        const input = document.getElementById('codeField');
        const nameInput = document.getElementById('nameInput');
        const whiteOut = document.getElementById('white-out');
        const inputContainer = document.getElementById('input-container');
        const finalPage = document.getElementById('final-page');

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: input.value, step: currentStep })
                });

                if (response.ok) {
                    input.style.borderColor = "#00ff00";
                    setTimeout(() => {
                        whiteOut.style.opacity = "1";
                        setTimeout(() => {
                            if (currentStep === 1) {
                                currentStep = 2;
                                whiteOut.style.opacity = "0";
                                input.value = ""; input.placeholder = "FINAL CODE"; input.focus();
                            } else {
                                whiteOut.style.opacity = "0";
                                inputContainer.style.display = "none";
                                finalPage.style.display = "flex";
                                // Enable scrolling for the long leaderboard
                                document.body.style.overflowY = "auto";
                                document.body.style.position = "relative";
                                loadLeaderboard();
                            }
                        }, 1500);
                    }, 500);
                } else {
                    input.value = ""; input.placeholder = "ACCESS DENIED";
                    setTimeout(() => { input.placeholder = currentStep === 1 ? "ENTER CODE" : "FINAL CODE"; }, 2000);
                }
            }
        });

        async function loadLeaderboard() {
            const res = await fetch('/api/check');
            const data = await res.json();
            renderList(data.leaderboard);
        }

        nameInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && nameInput.value.trim() !== "") {
                const res = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: nameInput.value })
                });
                const data = await res.json();
                renderList(data.leaderboard, nameInput.value);
                nameInput.style.display = "none";
            }
        });

        function renderList(list, highlightName) {
            const listEl = document.getElementById('leaderboard-list');
            if (!list || list.length === 0) {
                listEl.innerHTML = "<p>No entries yet. Be the first!</p>";
                return;
            }
            listEl.innerHTML = list.map((item, index) => `
                <div class="leader-row ${item.member === highlightName ? 'my-score' : ''}">
                    <span>${index + 1}. ${item.member}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
