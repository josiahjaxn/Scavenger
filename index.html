<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>DOCTOR'S HUNT</title>
    <style>
        :root {
            --screen-height: 100dvh; 
        }

        body { 
            background: linear-gradient(to bottom, #000000 60%, #443311 90%, #997722 100%);
            background-color: #000000;
            color: #d4af37;
            display: flex; 
            flex-direction: column;
            height: var(--screen-height); 
            width: 100vw;
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            font-family: 'Garamond', serif;
            overflow: hidden;
            position: fixed;
        }

        .container {
            width: 85%; 
            max-width: 350px; 
            text-align: center;
        }

        input { 
            width: 100%; 
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #d4af37; 
            border-radius: 12px;
            color: #f1e5ac; 
            font-size: 1.6rem; 
            padding: 18px;
            text-align: center; 
            outline: none; 
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 0 15px #997722;
            -webkit-appearance: none;
        }

        input::placeholder {
            color: #d4af37;
            transition: opacity 1.25s ease-in-out;
            animation: stableBlink 2.5s infinite both;
        }

        @keyframes stableBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }

        input:not(:placeholder-shown) {
            animation: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <input type="text" id="codeField" placeholder="ENTER CODE" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script>
        let currentStep = 1;
        const input = document.getElementById('codeField');

        window.addEventListener('resize', () => {
            document.documentElement.style.setProperty('--screen-height', `${window.innerHeight}px`);
        });

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const enteredCode = input.value;
                input.blur(); 
                
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: enteredCode, step: currentStep })
                });

                if (response.ok) {
                    if (currentStep === 1) {
                        currentStep = 2;
                        input.value = "";
                        input.placeholder = "SECOND KEY";
                    } else {
                        // REMEMBER TO UPDATE THIS LINK BEFORE YOU GO LIVE
                        window.location.href = "https://www.youtube.com/watch?v=YOUR_VIDEO_ID";
                    }
                } else {
                    input.value = "";
                    input.placeholder = "ACCESS DENIED";
                    input.style.borderColor = "red";
                    input.style.boxShadow = "0 0 20px red";

                    setTimeout(() => {
                        input.style.borderColor = "#d4af37";
                        input.style.boxShadow = "0 0 15px #997722";
                        input.placeholder = currentStep === 1 ? "ENTER CODE" : "SECOND KEY";
                        input.focus();
                    }, 2000);
                }
            }
        });
    </script>
</body>
</html>
