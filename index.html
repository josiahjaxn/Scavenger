<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000" id="nav-theme">
    <title>DOCTOR'S HUNT</title>
    <style>
        :root { --screen-height: 100dvh; }

        body { 
            background: linear-gradient(to bottom, #000000 60%, #443311 90%, #997722 100%);
            background-color: #000000;
            display: flex; 
            flex-direction: column;
            height: var(--screen-height); 
            width: 100vw;
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            font-family: 'Garamond', serif;
            overflow: hidden;
            position: fixed;
        }

        /* This handles the white fade transition */
        #white-out {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #efece3;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
            z-index: 999;
        }

        .container { width: 85%; max-width: 350px; text-align: center; z-index: 10; }

        input { 
            width: 100%; 
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #d4af37; 
            border-radius: 12px;
            color: #f1e5ac; 
            font-size: 1.6rem; 
            padding: 18px;
            text-align: center; 
            outline: none; 
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 0 15px #997722;
            transition: all 0.5s ease;
            -webkit-appearance: none;
        }

        /* Pulsing placeholder text */
        input::placeholder {
            color: #d4af37;
            transition: opacity 1.25s ease-in-out;
            animation: stableBlink 2.5s infinite both;
        }

        @keyframes stableBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }

        input:not(:placeholder-shown) {
            animation: none;
        }
    </style>
</head>
<body>

    <div id="white-out"></div>

    <div class="container">
        <input type="text" id="codeField" placeholder="ENTER CODE" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script>
        let currentStep = 1;
        const input = document.getElementById('codeField');
        const whiteOut = document.getElementById('white-out');
        const themeMeta = document.getElementById('nav-theme');

        // Fix for mobile keyboard height issues
        window.addEventListener('resize', () => {
            document.documentElement.style.setProperty('--screen-height', `${window.innerHeight}px`);
        });

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const enteredCode = input.value;
                input.blur(); 
                
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: enteredCode, step: currentStep })
                });

                if (response.ok) {
                    // CORRECT CODE EFFECT
                    input.style.borderColor = "#00ff00"; 
                    input.style.boxShadow = "0 0 20px #00ff00";
                    
                    setTimeout(() => {
                        // Fade to White
                        whiteOut.style.opacity = "1";
                        themeMeta.setAttribute("content", "#efece3");
                        
                        setTimeout(() => {
                            if (currentStep === 1) {
                                // MOVE TO LEVEL 2
                                currentStep = 2;
                                whiteOut.style.opacity = "0";
                                themeMeta.setAttribute("content", "#000000");
                                input.value = "";
                                input.style.borderColor = "#d4af37";
                                input.style.boxShadow = "0 0 15px #997722";
                                input.placeholder = "FINAL CODE";
                                input.focus();
                            } else {
                                // FINISHED: REPLACE WITH YOUR YOUTUBE URL
                                window.location.href = "https://www.youtube.com/watch?v=YOUR_VIDEO_ID";
                            }
                        }, 1500);
                    }, 500); 

                } else {
                    // WRONG CODE EFFECT
                    input.value = "";
                    input.placeholder = "ACCESS DENIED";
                    input.style.borderColor = "red";
                    input.style.boxShadow = "0 0 20px red";

                    setTimeout(() => {
                        input.style.borderColor = "#d4af37";
                        input.style.boxShadow = "0 0 15px #997722";
                        // Returns to correct text based on current level
                        input.placeholder = currentStep === 1 ? "ENTER CODE" : "FINAL CODE";
                        input.focus();
                    }, 2000);
                }
            }
        });
    </script>
</body>
</html>
