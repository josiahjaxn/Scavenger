<!DOCTYPE html>
<html>
<head>
    <title>THE VAULT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background: linear-gradient(to bottom, #000000 60%, #443311 90%, #997722 100%);
            color: #d4af37;
            display: flex; 
            flex-direction: column;
            height: 100vh; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            font-family: 'Garamond', serif;
            overflow: hidden;
        }

        .container {
            width: 90%; /* Helps with phone screens */
            max-width: 400px; /* Keeps it narrow on desktop */
            text-align: center;
        }

        input { 
            width: 100%; /* Fills the container */
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #d4af37; 
            border-radius: 8px;
            color: #f1e5ac; 
            font-size: 1.8rem; /* Larger text for mobile */
            padding: 20px;
            text-align: center; 
            outline: none; 
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 0 15px #997722;
            transition: border-color 0.3s ease;
        }

        /* The Blinking Animation - slower speed */
        @keyframes blinker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* This only blinks when the box is EMPTY */
        input:placeholder-shown {
            animation: blinker 2s linear infinite;
        }

        input::placeholder {
            color: #d4af37;
        }
    </style>
</head>
<body>

    <div class="container">
        <input type="text" id="codeField" placeholder="ENTER CODE" autofocus autocomplete="off">
    </div>

    <script>
        let currentStep = 1;
        const input = document.getElementById('codeField');

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const enteredCode = input.value;
                
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: enteredCode, step: currentStep })
                });

                if (response.ok) {
                    if (currentStep === 1) {
                        currentStep = 2;
                        input.value = "";
                        input.placeholder = "SECOND KEY";
                    } else {
                        window.location.href = "https://www.youtube.com/watch?v=YOUR_VIDEO_ID";
                    }
                } else {
                    // Fail state
                    input.value = "";
                    input.placeholder = "ACCESS DENIED";
                    input.style.borderColor = "red";
                    input.style.boxShadow = "0 0 20px red";

                    // Reset back to normal after 2 seconds
                    setTimeout(() => {
                        input.style.borderColor = "#d4af37";
                        input.style.boxShadow = "0 0 15px #997722";
                        input.placeholder = currentStep === 1 ? "ENTER CODE" : "SECOND KEY";
                    }, 2000);
                }
            }
        });
    </script>
</body>
</html>
