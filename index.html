<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000" id="nav-theme">
    <title>DOCTOR'S HUNT</title>
    <style>
        :root { --screen-height: 100dvh; }
        body { 
            background: linear-gradient(to bottom, #000000 60%, #443311 90%, #997722 100%);
            background-color: #000000;
            display: flex; flex-direction: column; height: var(--screen-height); width: 100vw;
            align-items: center; justify-content: center; margin: 0; font-family: 'Garamond', serif;
            overflow: hidden; position: fixed;
        }
        #white-out { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #efece3; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; z-index: 999; }
        .container { width: 90%; max-width: 450px; text-align: center; z-index: 10; }
        input { 
            width: 100%; box-sizing: border-box; background: rgba(0, 0, 0, 0.9); border: 2px solid #d4af37; 
            border-radius: 12px; color: #f1e5ac; font-size: 1.8rem; padding: 22px; text-align: center; 
            outline: none; text-transform: uppercase; letter-spacing: 4px; box-shadow: 0 0 15px #997722;
        }
        input::placeholder { color: #d4af37; animation: stableBlink 2.5s infinite both; }
        @keyframes stableBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
        
        #final-page { display: none; flex-direction: column; align-items: center; width: 100%; overflow-y: auto; padding: 40px 0; }
        #final-page h1 { color: #d4af37; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: 8px; margin: 10px 0; }
        .video-container { width: 85%; max-width: 75vw; aspect-ratio: 16 / 9; border: 3px solid #d4af37; border-radius: 15px; overflow: hidden; }
        
        /* Leaderboard Styling */
        .leaderboard-box { width: 85%; max-width: 500px; margin-top: 30px; color: #d4af37; }
        .leader-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #443311; font-size: 1.2rem; }
        .my-score { background: rgba(212, 175, 55, 0.2); color: #fff; font-weight: bold; }
        #nameInput { margin-top: 20px; font-size: 1.2rem; padding: 12px; }
    </style>
</head>
<body>
    <div id="white-out"></div>
    <div class="container" id="input-container">
        <input type="text" id="codeField" placeholder="ENTER CODE" autofocus autocomplete="off">
    </div>

    <div id="final-page">
        <h1>WELL DONE</h1>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/KmVngyE8flc" allowfullscreen></iframe>
        </div>
        
        <div class="leaderboard-box">
            <h3>LEADERBOARD</h3>
            <div id="leaderboard-list">Loading...</div>
            <input type="text" id="nameInput" placeholder="ENTER YOUR NAME" autocomplete="off">
        </div>
    </div>

    <script>
        let currentStep = 1;
        const input = document.getElementById('codeField');
        const nameInput = document.getElementById('nameInput');
        const whiteOut = document.getElementById('white-out');
        const inputContainer = document.getElementById('input-container');
        const finalPage = document.getElementById('final-page');

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: input.value, step: currentStep })
                });
                if (response.ok) {
                    input.style.borderColor = "#00ff00";
                    setTimeout(() => {
                        whiteOut.style.opacity = "1";
                        setTimeout(async () => {
                            if (currentStep === 1) {
                                currentStep = 2;
                                whiteOut.style.opacity = "0";
                                input.value = ""; input.placeholder = "FINAL CODE"; input.focus();
                            } else {
                                whiteOut.style.opacity = "0";
                                inputContainer.style.display = "none";
                                finalPage.style.display = "flex";
                                document.body.style.overflowY = "auto";
                                document.body.style.position = "static";
                                loadLeaderboard();
                            }
                        }, 1500);
                    }, 500);
                } else {
                    input.value = ""; input.placeholder = "ACCESS DENIED";
                    setTimeout(() => { input.placeholder = currentStep === 1 ? "ENTER CODE" : "FINAL CODE"; }, 2000);
                }
            }
        });

        async function loadLeaderboard() {
            const res = await fetch('/api/check');
            const data = await res.json();
            renderList(data.leaderboard);
        }

        nameInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && nameInput.value.trim() !== "") {
                const res = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: nameInput.value })
                });
                const data = await res.json();
                renderList(data.leaderboard, nameInput.value);
                nameInput.style.display = "none";
            }
        });

        function renderList(list, highlightName) {
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = list.map((item, index) => `
                <div class="leader-row ${item.member === highlightName ? 'my-score' : ''}">
                    <span>${index + 1}. ${item.member}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
